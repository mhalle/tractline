[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tractline"
dynamic = ["version"]                          # from src/tractline/__init__.py (tool.hatch.version)
description = "Diffusion MRI to named white-matter tracts: susceptibility correction, UKF tractography and tract labeling in torch"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
# The pipeline takes and returns arrays: reading the scan (nibabel, for NIfTI) is the caller's.
dependencies = [
    "numpy>=2",
    "torch>=2.7",
]

[project.optional-dependencies]
nrrd = ["pynrrd"]                              # tracker input/output as NRRD files (prep.prep, ukf.load)
triton = ["triton; sys_platform == 'linux'"]   # the UKF kernel on CUDA (Linux; torch's CUDA wheels bring it too)
t1check = ["scipy"]                            # t1check: the distortion left against the T1 (a measurement)
bids = ["nibabel", "scipy"]                    # tractline.bids: BIDS (and dcm2niix) input, the correcting series found and checked

# What the bench's scripts need beyond the package, as dependency groups: they never reach the published
# metadata. `dev` is uv's default group - `uv sync` / `uv run` install it - and holds what most scripts
# use. The rest are opt-in, named for their package and needed by a few scripts each:
# `uv run --group vtk bench/ukf_compare.py`.
# The Modal scripts run through the modal CLI, a uv tool (`uv tool install modal`), not this environment.
[dependency-groups]
dev = [
    "scipy",                   # the patients' loader (_ds001226.py), t1check, most measurements
    "nibabel",                 # reading NIfTI: the loader and most scripts
    "pynrrd>=1.1",             # NRRD files: the tracker's input as files, the bootstrap
    "trx-python>=0.6",         # trx_check.py
    "matplotlib>=3.11",        # cohort_summary.py's figure
    "pytest>=8",               # tests/: uv run pytest
    "ruff>=0.6",               # uv run ruff check
]
dipy = ["dipy>=1.12"]          # the reference median_otsu (median_check.py); the bootstrap's spherical harmonics
                               # (_bootstrap.py: label_noise_floor.py, ukf_noise_floor.py)
vtk = ["vtk>=9.7"]             # 0.5 GB: VTK tractography files (ukf_compare.py, ukf_bench.py, resample_check.py)
sklearn = ["scikit-learn>=1.9"]   # accuracy_tractcloud_test.py's macro F1

[tool.hatch.version]
path = "src/tractline/__init__.py"

# The sdist: the package, its tests and the documents a user reads - not the bench, its results or journal.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/uv.lock",
           "/.python-version", "/docs/pipeline.md", "/docs/labelers.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/tractline"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# pyflakes (undefined, shadowed and unused names - F823 catches a name read before a local import of it)
# and syntax errors; style is not checked.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
